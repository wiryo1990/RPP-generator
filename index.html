<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPP Generator</title>
    <style>
        :root {
            --primary: #9b51e0;
            --primary-light: #f3e8ff;
            --bg-gradient: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            --white: #ffffff;
            --text-dark: #333333;
            --text-muted: #888888;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
            min-height: 100vh;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
        }

        .header p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .panel {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            flex: 1;
            min-width: 300px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 600;
            font-size: 13px;
            color: var(--primary);
        }

        input, select, textarea {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
            background-color: #fafafa;
        }

        input::placeholder, textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--white);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: flex-end;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #8a3ec9; }
        .btn-outline { background: white; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary-light); }

        #rpp-preview {
            font-family: 'Times New Roman', Times, serif;
            line-height: 1.5;
            color: black;
            padding: 20px;
            background: white;
            border: 1px solid #ddd;
            min-height: 500px;
        }

        .rpp-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        
        .rpp-table th, .rpp-table td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }

        /* Print Specific Styles */
        @media print {
            body { background: white; margin: 0; padding: 0; }
            .header, .panel:first-child, .actions { display: none !important; }
            .panel { box-shadow: none; border: none; padding: 0; width: 100%; }
            #rpp-preview { border: none; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>RPP Generator <span style="font-size:14px; background:rgba(255,255,255,0.2); padding:3px 8px; border-radius:12px;">Kurikulum Merdeka</span></h1>
        <p>Aplikasi ini dikembangkan oleh: Wiryo, S.Pd</p>
    </div>

    <div class="container">
        <!-- Form Panel -->
        <div class="panel" style="flex: 1.2;">
            <div class="actions" style="justify-content: space-between; border-bottom: none; margin-bottom: 10px;">
                <h3 style="margin: 0; color: var(--primary);">Parameter Input RPP</h3>
                <button class="btn-outline" onclick="document.getElementById('rppForm').reset(); generateRPP();">Reset</button>
            </div>
            
            <form id="rppForm" class="form-grid" oninput="generateRPP()">
                <div class="form-group">
                    <label>Nama Penyusun / Guru</label>
                    <input type="text" id="nama" placeholder="Contoh: Wiryo, S.Pd">
                </div>
                <div class="form-group">
                    <label>Nama Sekolah</label>
                    <input type="text" id="sekolah" placeholder="Contoh: SD Negeri Teluk Santong">
                </div>
                <div class="form-group full-width">
                    <label>Mata Pelajaran</label>
                    <input type="text" id="mapel" placeholder="Contoh: Bahasa Indonesia">
                </div>
                <div class="form-group">
                    <label>Jenjang</label>
                    <select id="jenjang">
                        <option value="SD">SD</option>
                        <option value="SMP">SMP</option>
                        <option value="SMA">SMA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fase</label>
                    <select id="fase">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                        <option value="F">F</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Kelas</label>
                    <input type="text" id="kelas" placeholder="Contoh: II (Dua)">
                </div>
                <div class="form-group">
                    <label>Alokasi Waktu</label>
                    <input type="text" id="waktu" placeholder="Contoh: 1 pertemuan (3 x 35 menit)">
                </div>
                <div class="form-group full-width">
                    <label>Topik / Sub-Materi</label>
                    <input type="text" id="topik" placeholder="Contoh: Penggunaan kata 'di' sebagai kata depan dan awalan">
                </div>
                <div class="form-group full-width">
                    <label>Tujuan Pembelajaran (TP)</label>
                    <textarea id="tujuan" placeholder="Tuliskan tujuan pembelajaran yang ingin dicapai siswa..."></textarea>
                </div>
            </form>
        </div>

        <!-- Preview Panel -->
        <div class="panel" style="flex: 2;">
            <div class="actions">
                <span style="margin-right: auto; font-weight: bold; align-self: center;">Dokumen Siap / Tinjauan RPP</span>
                <button class="btn-primary" onclick="window.print()">Cetak / Simpan PDF</button>
                <button class="btn-outline" onclick="copyText()">Salin Teks</button>
                <button class="btn-outline" onclick="exportWord()">Unduh (.doc)</button>
            </div>
            <div id="rpp-preview">
                <!-- Konten RPP akan muncul di sini -->
            </div>
        </div>
    </div>

    <script>
        function generateRPP() {
            const nama = document.getElementById('nama').value || '[Nama Penyusun]';
            const sekolah = document.getElementById('sekolah').value || '[Nama Sekolah]';
            const mapel = document.getElementById('mapel').value || '[Mata Pelajaran]';
            const jenjang = document.getElementById('jenjang').value;
            const fase = document.getElementById('fase').value;
            const kelas = document.getElementById('kelas').value || '[Kelas]';
            const waktu = document.getElementById('waktu').value || '[Alokasi Waktu]';
            const topik = document.getElementById('topik').value || '[Topik Materi]';
            const tujuan = document.getElementById('tujuan').value.replace(/\n/g, '<br>• ') || '[Tujuan Pembelajaran]';

            const d = new Date();
            const tanggal = d.getDate() + ' ' + d.toLocaleString('id-ID', { month: 'long' }) + ' ' + d.getFullYear();

            const html = `
                <h3 style="text-align: center; margin-bottom: 20px;">RENCANA PELAKSANAAN PEMBELAJARAN (RPP)</h3>
                
                <h4 style="margin-bottom: 5px;">Informasi Umum</h4>
                <table style="width: 100%; border: none; margin-bottom: 15px;">
                    <tr><td style="width: 25%;">Nama Penyusun</td><td style="width: 2%;">:</td><td>${nama}</td></tr>
                    <tr><td>Sekolah</td><td>:</td><td>${sekolah}</td></tr>
                    <tr><td>Mata Pelajaran</td><td>:</td><td>${mapel}</td></tr>
                    <tr><td>Topik materi</td><td>:</td><td>${topik}</td></tr>
                    <tr><td>Fase / Kelas</td><td>:</td><td>${fase} / ${kelas} (${jenjang})</td></tr>
                    <tr><td>Alokasi Waktu</td><td>:</td><td>${waktu}</td></tr>
                </table>

                <h4 style="margin-bottom: 5px;">Tujuan Pembelajaran:</h4>
                <ul style="margin-top: 5px;">
                    <li>${tujuan}</li>
                </ul>

                <h4 style="margin-bottom: 5px;">Integrasi Pola Pikir Bertumbuh (Growth Mindset)</h4>
                <ul style="margin-top: 5px;">
                    <li><strong>Prinsip:</strong> Kesalahan adalah bagian dari proses belajar. Guru menggunakan kata "belum" pada kalimat negatif yang akan mengubah perspektif dari "jalan buntu" menjadi "proses yang sedang berjalan".</li>
                    <li><strong>Kegiatan:</strong> Siswa diajak saling mendukung saat berlatih dan merayakan proses perbaikan tulisan mereka.</li>
                </ul>

                <h4 style="margin-bottom: 5px;">Pemanfaatan Digital</h4>
                <ul style="margin-top: 5px;">
                    <li>Papan Interaktif Digital / Proyektor untuk menampilkan materi interaktif.</li>
                    <li>Penggunaan aplikasi kuis interaktif atau media visual untuk evaluasi proses belajar.</li>
                </ul>

                <h4 style="margin-bottom: 5px;">Kegiatan Pembelajaran</h4>
                <div style="margin-left: 15px;">
                    <p><strong>➤ Kegiatan Pendahuluan</strong></p>
                    <ul>
                        <li>Guru membuka kelas dengan salam dan menanyakan kabar/perasaan siswa.</li>
                        <li>Berdoa bersama dan mengecek kehadiran.</li>
                        <li>Guru membangun pola pikir bertumbuh: <em>"Hari ini kita akan belajar hal baru. Kalau ada yang merasa sulit, itu wajar! Otak kita sedang bekerja dan bertumbuh."</em></li>
                    </ul>

                    <p><strong>➤ Kegiatan Inti</strong></p>
                    <ul>
                        <li><strong>Eksplorasi Konsep:</strong> Guru menjelaskan topik <strong>${topik}</strong>.</li>
                        <li><strong>Latihan Berkelompok:</strong> Siswa berkolaborasi dalam tim. Guru menggunakan perangkat digital untuk memandu aktivitas.</li>
                        <li><strong>Intervensi Growth Mindset:</strong> Jika murid kesulitan, guru merespons dengan: <em>"Bukan tidak bisa, tapi belum bisa. Mari kita asah otak kita bersama."</em></li>
                    </ul>

                    <p><strong>➤ Kegiatan Penutup</strong></p>
                    <ul>
                        <li>Siswa melakukan refleksi singkat mengenai tantangan hari ini dan cara mengatasinya.</li>
                        <li>Guru menutup dengan apresiasi terhadap usaha keras (proses) siswa.</li>
                    </ul>
                </div>

                <h4 style="margin-bottom: 5px;">Rubrik Penilaian (Berorientasi pada Pola Pikir Bertumbuh)</h4>
                <table class="rpp-table">
                    <thead>
                        <tr style="background-color: #f2f2f2;">
                            <th>Kriteria Penilaian</th>
                            <th>Perlu Pendampingan (Skor 1)</th>
                            <th>Mulai Berkembang (Skor 2)</th>
                            <th>Berkembang Sesuai Harapan (Skor
